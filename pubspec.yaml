name: tg_cine
description: "Telegram-powered personal movie and TV player."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  forui: ^0.27.4
  intl: ^0.20.3
  material_ui: ^1.6.0
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  shared_preferences: 2.5.6
  ffi: 2.2.0
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.5
  path: 1.9.1
  sqlite3: 3.7.1

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

  crypto: 3.0.7
flutter:
  generate: true
  uses-material-design: true
