name: Build mobile TDLib
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: '复用本仓库已完成原生构建的运行 ID；留空从固定源码构建'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Android build tools
        if: matrix.platform == 'android' && inputs.artifact_run_id == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf cmake ninja-build g++ make perl php default-jdk
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: iOS build tools
        if: matrix.platform == 'ios' && inputs.artifact_run_id == ''
        run: brew install gperf cmake coreutils
      - run: bash app/tool/build_mobile_tdlib.sh ${{ matrix.platform }}
        if: inputs.artifact_run_id == ''
      - name: Reuse verified native build artifacts
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]] || exit 64
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "tdlib-${{ matrix.platform }}-c15d3f5" --dir ".cache/native/mobile-build/${{ matrix.platform }}/package"
      - name: Stage verified native artifacts
        run: python3 app/tool/install_mobile_tdlib.py .cache/native/mobile-build/${{ matrix.platform }}/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tdlib-${{ matrix.platform }}-c15d3f5
          path: .cache/native/mobile-build/${{ matrix.platform }}/package/
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: app
      - name: Build Android with bundled TDLib
        if: matrix.platform == 'android'
        working-directory: app
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          flutter build apk --debug
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/arm64-v8a/libtdjson.so'
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/x86_64/libtdjson.so'
      - name: Start iOS simulator
        if: matrix.platform == 'ios'
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in devices.items() if ".iOS-" in runtime for d in items if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          echo "TGCINE_IOS_SIMULATOR=$simulator" >> "$GITHUB_ENV"
      - name: Verify iOS native ABI and isolated library lifecycle
        if: matrix.platform == 'ios'
        working-directory: app
        run: |
          flutter test integration_test/tdlib_native_test.dart -d "$TGCINE_IOS_SIMULATOR"
          flutter test integration_test/local_media_test.dart integration_test/library_test.dart integration_test/public_service_test.dart -d "$TGCINE_IOS_SIMULATOR"
      - name: Build unsigned iOS with bundled TDLib
        if: matrix.platform == 'ios'
        working-directory: app
        run: |
          flutter build ios --debug --no-codesign
          test -f build/ios/iphoneos/Runner.app/Frameworks/tdjson.framework/tdjson
