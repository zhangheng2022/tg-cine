<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TG Cine · UI 设计总览</title>
<style>
@font-face{font-family:Inter;src:url('assets/Inter.ttf');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#171717;font:14px/1.65 Inter,'Microsoft YaHei',sans-serif}header{padding:36px max(24px,calc((100vw - 1320px)/2));background:#fff;border-bottom:1px solid #e5e5e5}h1{font-size:30px;letter-spacing:-.025em;margin:0}p{color:#666;margin:10px 0}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}nav a{padding:9px 14px;border:1px solid #e5e5e5;border-radius:8px;text-decoration:none;min-height:44px}nav a:focus-visible,a:focus-visible{outline:2px solid #171717;outline-offset:3px}main{max-width:1320px;margin:0 auto;padding:20px 24px 60px}.section{padding-top:36px}h2{font-size:22px;margin:0 0 8px}.pair{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;margin-top:20px}.figure{margin:0;min-width:0}.figure a{display:block}.figure img{display:block;width:100%;height:auto;border:1px solid #dedede;border-radius:12px;background:#fff}figcaption{font-size:12px;color:#666;margin:10px 0 18px}.wide-stack{display:grid;gap:16px}.note{border-left:0;padding:16px;background:#fff;border-radius:8px;margin-top:24px}.aux{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}.aux img{width:100%;height:auto;border-radius:10px;border:1px solid #e5e5e5}.aux figure{margin:0}footer{padding:30px 0;border-top:1px solid #dedede;margin-top:40px;color:#666}.detail-link{display:inline-block;margin-top:5px}.variant-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px;padding-left:20px}.variant-links a{display:block;padding:12px 0;min-height:48px}@media(max-width:800px){.pair{grid-template-columns:1fr}.pair>.figure{max-width:390px}.aux{grid-template-columns:1fr 1fr}}@media(max-width:480px){.aux{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><h1>TG Cine · UI 设计</h1><p>静态高保真设计稿 · 手机与宽屏同步设计 · ForUI neutral 明暗主题 · 2026-10-12</p><p>所有影片、账号、计数与服务状态均为示例，控件没有业务行为。Flutter 与 Worker 源码保持原样。</p><nav><a href="#library">片库与搜索</a><a href="#details">详情与播放</a><a href="#organizing">记录与整理</a><a href="#first-use">首次启用</a><a href="#support">隐私与恢复</a><a href="#variants">主题与尺寸</a><a href="ui-spec.md">设计规范</a></nav></header>
<main id="boards"></main>
<script>
const sections=[
 ['library','片库与搜索',[['library','片库首页','手机进入独立详情；宽屏同时浏览片库与选中影片。'],['search','搜索结果','检索已选来源，区分片名与原文件名匹配。']]],
 ['details','详情与播放',[['movie','电影详情','本机续看、版本选择、实际媒体来源与资料纠正。'],['series','剧集详情','只为已导入的集提供入口，显示本机观看状态。'],['player','播放器','保留画幅、减少干扰；字幕和音轨仅在实际可用时展示。']]],
 ['organizing','记录与整理',[['history','观看记录','按时间排列，仅保存本机进度；移除来源后的记录仍有说明。'],['sources','媒体来源','来源列表、渐进导入、官方赞助消息位置。'],['source-detail','来源详情','计数、暂停、失败重试与移除本机关联。'],['pending','待整理列表','保留原文件名、来源与待确认原因，逐条纠正。'],['organize','纠正资料','原文件与资料候选并排，人工选择优先。']]],
 ['first-use','首次启用',[['welcome','欢迎与媒体说明','说明个人来源、隐私和非官方客户端身份。'],['login','Telegram 登录','展示国家与号码结构；静态页面不提交数据。'],['verify','验证码','区分验证码、重发与两步验证；不编造实际登录响应。'],['choose-sources','选择来源','只整理用户主动选择、有权限的频道或群。'],['importing','首次导入','已识别内容立即可用，不展示未知总量的百分比。']]],
 ['support','隐私与恢复',[['settings','设置','默认服务无需手填地址；本机数据、隐私、反馈与关于。'],['privacy','隐私与数据','政策页面结构草案，待真实数据处理确定后完善。'],['report','内容反馈','本机隐藏与主动提交分开，提交前明确必要信息。'],['empty','未选择来源','告诉用户片库如何产生，并给出选择来源入口。'],['no-results','搜索无结果','说明检索范围，支持清除筛选。'],['service-error','服务暂不可用','片库与本机记录保留，播放前恢复默认服务。'],['media-error','媒体失效','保留播放位置，选择其他版本或查看来源。'],['states','组件与关键状态','展示焦点、禁用、等待、限额、两步验证和确认清理。']]]
];
const figure=(page,name,size,theme='light',suffix='')=>`<figure class="figure"><a href="screen.html?page=${page}&theme=${theme}&full${suffix}" target="_blank"><img loading="lazy" src="exports/${size}-${page}-${theme}${suffix?'--large':''}.jpg" alt="${name} ${size==='phone'?'手机':'宽屏'} ${theme==='dark'?'深色':'浅色'} 静态设计稿"></a><figcaption>${size==='phone'?'390 × 844 手机':'1440 × 900 宽屏'} · ${theme==='dark'?'深色':'浅色'} · 可滚动长页面展开导出</figcaption></figure>`;
document.getElementById('boards').innerHTML=sections.map(([id,title,pages])=>`<section class="section" id="${id}"><h2>${title}</h2>${pages.map(([page,name,copy])=>`<section class="section"><h2>${name}</h2><p>${copy}</p><div class="pair">${figure(page,name,'phone')}<div class="wide-stack">${figure(page,name,'wide')}<a class="detail-link" href="screen.html?page=${page}&theme=dark&full" target="_blank">查看此页面的深色设计</a></div></div></section>`).join('')}</section>`).join('')+`<section class="section" id="variants"><h2>明暗与响应式检查</h2><p>深色主题、320dp 小屏、800dp 中屏和 1.3 倍文字示意。静态检查不代替 Flutter 的字体缩放和真机验收。</p><div class="aux"><figure><img src="exports/phone-library-dark.jpg" alt="深色手机片库"><figcaption>390dp 手机 · 深色</figcaption></figure><figure><img src="exports/phone-settings-dark.jpg" alt="深色手机设置"><figcaption>390dp 手机设置 · 深色</figcaption></figure><figure><img src="exports/small-library-dark--large.jpg" alt="320dp 手机大字体"><figcaption>320dp 手机 · 深色 · 1.3 倍文字</figcaption></figure></div><div class="section"><img style="width:100%;border-radius:12px;border:1px solid #dedede" src="exports/wide-library-dark.jpg" alt="深色宽屏片库"><p>1440dp 宽屏 · 深色</p><img style="max-width:800px;width:100%;border-radius:12px;border:1px solid #dedede" src="exports/tablet-library-light.jpg" alt="800dp 中屏片库"><p>800dp 中屏 · 窄侧栏，独立详情路径</p></div><h3 style="margin-top:28px">全部补充检查稿</h3><ul class="variant-links"><li><a href="exports/phone-library-dark.jpg" target="_blank">390dp 手机片库 · 深色</a></li><li><a href="exports/wide-library-dark.jpg" target="_blank">1440dp 宽屏片库 · 深色</a></li><li><a href="exports/phone-settings-dark.jpg" target="_blank">390dp 手机设置 · 深色</a></li><li><a href="exports/wide-settings-dark.jpg" target="_blank">1440dp 宽屏设置 · 深色</a></li><li><a href="exports/phone-movie-dark.jpg" target="_blank">390dp 手机电影详情 · 深色</a></li><li><a href="exports/wide-movie-dark.jpg" target="_blank">1440dp 宽屏电影详情 · 深色</a></li><li><a href="exports/phone-sources-dark.jpg" target="_blank">390dp 手机来源 · 深色</a></li><li><a href="exports/wide-sources-dark.jpg" target="_blank">1440dp 宽屏来源 · 深色</a></li><li><a href="exports/phone-states-dark.jpg" target="_blank">390dp 手机状态 · 深色</a></li><li><a href="exports/wide-states-dark.jpg" target="_blank">1440dp 宽屏状态 · 深色</a></li><li><a href="exports/tablet-library-light.jpg" target="_blank">800dp 中屏片库 · 浅色</a></li><li><a href="exports/desktop1280-library-light.jpg" target="_blank">1280dp 片库 · 浅色</a></li><li><a href="exports/small-library-dark--large.jpg" target="_blank">320dp 手机片库 · 深色大字</a></li><li><a href="exports/small-settings-dark--large.jpg" target="_blank">320dp 手机设置 · 深色大字</a></li><li><a href="exports/desktop1280-library-dark--large.jpg" target="_blank">1280dp 片库 · 深色大字</a></li></ul></section><footer>共 23 个页面 / 状态，46 张主稿，另附主题与尺寸检查稿。<a href="ui-spec.md">阅读设计规范</a> · <a href="assets/fictional-posters.prompt.txt">原创素材提示词</a></footer>`;
</script>
</body></html>
